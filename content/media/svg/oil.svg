<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#f4e5c8"/>
  <!-- tiles -->
  <g fill="#9cb2ae" opacity=".5"><rect x="0" y="0" width="512" height="300"/></g>
  <g stroke="#f4e5c8" stroke-width="4"><path d="M0 75 H512 M0 150 H512 M0 225 H512 M85 0 V300 M170 0 V300 M255 0 V300 M340 0 V300 M425 0 V300"/></g>
  <!-- stove top -->
  <rect y="300" width="512" height="212" fill="#2e4244"/>
  <rect y="300" width="512" height="14" fill="#5c7f7d"/>
  <ellipse cx="230" cy="420" rx="120" ry="30" fill="none" stroke="#5c7f7d" stroke-width="8"/>
  <g fill="#e28a3e"><path d="M140 420 l8 -18 l8 18z M190 432 l8 -18 l8 18z M250 434 l8 -18 l8 18z M306 424 l8 -18 l8 18z"/></g>
  <!-- frying pan -->
  <path d="M330 380 L480 350" stroke="#2e4244" stroke-width="18" stroke-linecap="round"/>
  <path d="M330 380 L480 350" stroke="#884522" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="230" cy="390" rx="130" ry="36" fill="#5c7f7d"/>
  <ellipse cx="230" cy="384" rx="114" ry="28" fill="#2e4244"/>
  <!-- oil pool in pan -->
  <ellipse cx="216" cy="388" rx="54" ry="13" fill="#e0a93f"/>
  <ellipse cx="204" cy="385" rx="18" ry="4" fill="#f6e39a"/>
  <!-- stream of oil -->
  <path d="M232 170 Q226 280 220 386" stroke="#e0a93f" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M230 200 Q226 280 222 360" stroke="#f6e39a" stroke-width="3" fill="none"/>
  <!-- tilted glass oil bottle -->
  <g transform="rotate(-128 270 140)">
    <path d="M226 60 h40 v40 q40 24 40 70 v110 q0 14 -14 14 h-92 q-14 0 -14 -14 v-110 q0 -46 40 -70z" fill="#dfe8e2" opacity=".7"/>
    <path d="M186 190 h120 v90 q0 14 -14 14 h-92 q-14 0 -14 -14z" fill="#e0a93f"/>
    <path d="M226 60 h40 v40 q40 24 40 70 v110 q0 14 -14 14 h-92 q-14 0 -14 -14 v-110 q0 -46 40 -70z" fill="none" stroke="#5c7f7d" stroke-width="4"/>
    <rect x="222" y="44" width="48" height="20" rx="5" fill="#808968"/>
    <path d="M200 200 v60" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity=".8"/>
  </g>
  <!-- olives -->
  <g fill="#808968"><ellipse cx="420" cy="250" rx="14" ry="10"/><ellipse cx="446" cy="262" rx="14" ry="10"/></g>
  <path d="M410 240 q20 -30 50 -28" stroke="#5c7f7d" stroke-width="3" fill="none"/>
  <path d="M440 212 q14 -10 26 -2 q-12 10 -26 2z" fill="#5c7f7d"/>
</svg>
